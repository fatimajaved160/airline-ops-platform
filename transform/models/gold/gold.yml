version: 2

models:
  - name: dim_airports
    description: One row per airport with an IATA code
    columns:
      - name: iata_code
        tests: [unique, not_null]
      - name: icao_code
        description: Stable 4-letter code; flights are linked to airports through this
        tests: [unique, not_null]

  - name: dim_airlines
    description: One row per version of each airline (SCD Type 2)
    columns:
      - name: airline_key
        tests: [unique, not_null]

  - name: fct_flights
    description: One row per flight, linked to airports and the airline version valid on the day
    columns:
      - name: flight_id
        tests: [unique, not_null]
      - name: airline_key
        description: Null would mean a carrier is missing from seeds/carriers.csv
        tests: [not_null]
      - name: origin_icao
        description: Null means the origin code matched no airport; add a row to seeds/airport_code_aliases.csv
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airports')
                field: icao_code
      - name: dest_icao
        description: Null means the destination code matched no airport; add a row to seeds/airport_code_aliases.csv
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airports')
                field: icao_code
